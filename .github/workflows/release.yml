name: Release

# Run only when started by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Inspect the path settings
        run: |
          echo "GOPATH is $(go env GOPATH)"
          echo "GITHUB_PATH points to $GITHUB_PATH"
          echo "PATH is $PATH"

      - name: Build the app
        working-directory: gui
        run: wails build -tags webkit2_41

      - name: Show the output
        run: ls -la gui/build/bin

      - name: Save the binary
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: gui/build/bin/gui